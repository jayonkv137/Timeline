<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoTrace · Authentic Obsidian Graph View v0</title>
  <link rel="stylesheet" href="_theme.css">
  <style>
    body {
      background: var(--graph-bg);
      color: var(--label-color);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    #graph-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #graph-canvas:active {
      cursor: grabbing;
    }

    /* Floating Top HUD Bar */
    .graph-hud-top {
      position: absolute;
      top: 54px;
      left: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .graph-hud-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--label-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .graph-hud-title strong {
      color: var(--text-primary);
    }

    /* Floating Legend */
    .graph-legend {
      position: absolute;
      bottom: 24px;
      left: 24px;
      font-size: 11px;
      color: var(--label-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 100;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot-u { width: 8px; height: 8px; border-radius: 50%; background: var(--party-user); box-shadow: 0 0 6px var(--party-user); }
    .dot-a { width: 8px; height: 8px; border-radius: 50%; background: var(--party-ai); box-shadow: 0 0 6px var(--party-ai); }
    .line-solid-sample { width: 16px; height: 2px; background: var(--tether-active); border-radius: 1px; }
    .line-dashed-sample { width: 16px; height: 0px; border-top: 1.5px dashed var(--label-muted); }

    /* Minimalist Obsidian Tooltip */
    #satellite-tooltip {
      position: absolute;
      z-index: 2000;
      display: none;
      pointer-events: none;
      max-width: 320px;
      background: var(--tooltip-bg);
      border: 1px solid var(--tooltip-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      transition: opacity var(--transition-fast);
    }
    .tooltip-header {
      font-size: var(--tooltip-header-size);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .tooltip-body {
      font-size: var(--tooltip-body-size);
      color: var(--label-color);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <canvas id="graph-canvas"></canvas>

  <div class="graph-hud-top">
    <div class="graph-hud-title">
      CoTrace <strong>Obsidian Graph View</strong>
      <span class="mock-badge" style="margin-left: 6px;">★ Locked v0</span>
    </div>
  </div>

  <div class="graph-legend">
    <div class="legend-item"><div class="dot-u"></div><span>User</span></div>
    <div class="legend-item"><div class="dot-a"></div><span>AI</span></div>
    <div class="legend-item"><div class="line-solid-sample"></div><span>Hierarchy (Parent)</span></div>
    <div class="legend-item"><div class="line-dashed-sample"></div><span>Related</span></div>
  </div>

  <div id="satellite-tooltip">
    <div id="tooltip-header" class="tooltip-header"></div>
    <div id="tooltip-body" class="tooltip-body"></div>
  </div>

  <script type="module">
    import { renderMockBar, loadCapture, resolveColors } from './_shell.js';

    // 1. Load real chat fixture (c05)
    const capture = await loadCapture('c05');
    if (!capture) {
      alert('Error: captures/c05.json not found. Run scripts/design_system/capture.py first.');
    }

    // 2. Render Mock Shell Header
    const shell = renderMockBar({
      title: 'Graph View (v0 Port)',
      status: '★ LOCKED',
      capture: capture,
      onStateChange: ({ pair }) => {
        if (pair) switchPair(pair);
      }
    });

    const canvas = document.getElementById('graph-canvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('satellite-tooltip');
    const tooltipHeader = document.getElementById('tooltip-header');
    const tooltipBody = document.getElementById('tooltip-body');

    // Graph state
    let currentPair = shell.getPair() || 1;
    let zoom = 1.0;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      render();
    }
    window.addEventListener('resize', resize);

    // Build pair-specific graph frames from real capture data
    function getGraphDataForPair(pNum) {
      const pairIdx = pNum - 1;
      const pairData = capture.pairs[pairIdx] || capture.pairs[0];
      const allOutcomes = capture.outcomes || [];
      const colors = resolveColors();

      // Determine active nodes up to this pair
      const nodes = [];
      const links = [];

      // Root node
      const root = allOutcomes.find(o => o.parent === null) || { id: 'outcome 1', text: capture.title };
      nodes.push({
        id: root.id,
        text: root.text,
        isRoot: true,
        x: 0,
        y: 0,
        radius: 26,
        pinned: true
      });

      // Child nodes
      const children = allOutcomes.filter(o => o.parent !== null);
      const angleStep = (Math.PI * 2) / Math.max(children.length, 1);
      
      children.forEach((child, i) => {
        const angle = i * angleStep - Math.PI / 2;
        const dist = 220;
        const cx = Math.cos(angle) * dist;
        const cy = Math.sin(angle) * dist;

        // Compute accumulated mass up to this pair from panel bundle
        let userMass = 0;
        let aiMass = 0;
        for (let p = 0; p <= pairIdx; p++) {
          const pDrawer = capture.pairs[p]?.timeline?.drawer?.requirements || [];
          pDrawer.forEach(r => {
            if (r.outcome_id === child.id) {
              userMass += r.delta_you || 0;
              aiMass += r.delta_ai || 0;
            }
          });
        }

        const totalMass = userMass + aiMass;
        const baseRadius = 20;
        const radius = Math.min(42, baseRadius + Math.sqrt(totalMass) * 1.8);

        // Satellites (Requirements + Open Questions) up to this pair
        const satellites = [];
        const outcomeReqs = [];
        for (let p = 0; p <= pairIdx; p++) {
          const reqs = capture.pairs[p]?.timeline?.drawer?.requirements || [];
          reqs.forEach(r => {
            if (r.outcome_id === child.id) outcomeReqs.push(r);
          });
        }

        // Place satellites in upper crown canopy (angles -150° to -30°)
        const crownStart = -Math.PI * 0.85;
        const crownEnd = -Math.PI * 0.15;
        const crownStep = outcomeReqs.length > 1 ? (crownEnd - crownStart) / (outcomeReqs.length - 1) : 0;

        outcomeReqs.forEach((r, sIdx) => {
          const sAngle = outcomeReqs.length === 1 ? -Math.PI / 2 : crownStart + sIdx * crownStep;
          satellites.push({
            id: r.req_id,
            label: r.label,
            text: r.op === 'create' ? `Requirement: ${r.label}` : r.label,
            radius: 3.5,
            angle: sAngle,
            dist: radius + 18,
            color: r.delta_you >= r.delta_ai ? colors.partyUser : colors.partyAi,
            isHollowRing: false,
            isResolvedSlot: false
          });
        });

        // Add slot if open at this pair
        const slots = pairData.timeline?.drawer?.slots || [];
        slots.forEach((s, slotIdx) => {
          if (s.status === 'open' || s.status === 'abandoned') {
            satellites.push({
              id: s.slot_id,
              label: s.slot_id,
              text: `Open Question: ${s.slot_id}`,
              radius: 4.5,
              angle: -Math.PI * 0.5 + (slotIdx * 0.4),
              dist: radius + 22,
              color: colors.partyAi,
              isHollowRing: true,
              isResolvedSlot: false
            });
          }
        });

        nodes.push({
          id: child.id,
          text: child.text,
          isRoot: false,
          x: cx,
          y: cy,
          radius: radius,
          userScore: userMass,
          aiScore: aiMass,
          isDormant: totalMass === 0,
          isTerminalActive: i === 0 && pNum > 1,
          satellites: satellites
        });

        // Parent-child tether
        links.push({
          source: root.id,
          target: child.id,
          type: 'parent_child',
          isDormant: totalMass === 0
        });
      });

      return { nodes, links };
    }

    let { nodes, links } = getGraphDataForPair(currentPair);

    function switchPair(pNum) {
      currentPair = pNum;
      const data = getGraphDataForPair(currentPair);
      nodes = data.nodes;
      links = data.links;
      render();
    }

    // Drawing Helpers
    function drawClippedLine(x1, y1, r1, x2, y2, r2, isDashed, strokeColor, lineWidth) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist <= r1 + r2) return;

      const nx = dx / dist;
      const ny = dy / dist;
      const startX = x1 + nx * r1;
      const startY = y1 + ny * r1;
      const endX = x2 - nx * r2;
      const endY = y2 - ny * r2;

      ctx.save();
      ctx.beginPath();
      if (isDashed) ctx.setLineDash([5, 5]);
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
      ctx.restore();
    }

    function drawWrappedText(text, x, y, maxWidth, lineHeight, opacity, fontSize, isRoot) {
      if (opacity <= 0) return;
      const colors = resolveColors();
      ctx.save();
      ctx.font = `${isRoot ? '600' : '500'} ${fontSize}px var(--font-sans)`;
      ctx.textAlign = 'center';
      ctx.fillStyle = isRoot ? colors.nodeRootFill : colors.labelColor;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 4;

      const words = text.split(' ');
      const lines = [];
      let currentLine = words[0];

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + " " + word).width;
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);

      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, y + i * lineHeight);
      }
      ctx.restore();
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      const colors = resolveColors();

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = colors.graphBg;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w / 2 + panX, h / 2 + panY);
      ctx.scale(zoom, zoom);

      // 1. Draw Links
      for (const link of links) {
        const u = nodes.find(n => n.id === link.source);
        const v = nodes.find(n => n.id === link.target);
        if (!u || !v) continue;

        if (link.type === 'parent_child') {
          drawClippedLine(u.x, u.y, u.radius, v.x, v.y, v.radius, false, link.isDormant ? colors.tetherDormant : colors.tetherActive, 1.5);
        } else {
          drawClippedLine(u.x, u.y, u.radius, v.x, v.y, v.radius, true, colors.tetherDormant, 1.2);
        }
      }

      // 2. Draw Nodes
      for (const node of nodes) {
        if (node.isRoot) {
          // Root Singularity Anchor
          const grad = ctx.createRadialGradient(node.x, node.y, node.radius * 0.5, node.x, node.y, node.radius * 2.4);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
          grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.25)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.radius * 2.4, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
          ctx.fillStyle = colors.nodeRootFill;
          ctx.shadowColor = 'rgba(255, 255, 255, 0.85)';
          ctx.shadowBlur = 14;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Concentric Origin Rings
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(node.x, node.y, node.radius * 1.55, 0, Math.PI * 2);
          ctx.stroke();

          drawWrappedText(node.text, node.x, node.y + node.radius * 2.1 + 8, 180, 16, 1.0, 12.5, true);
        } else {
          // Child Frosted Sphere with Dual Internal Radiance
          const r = node.radius;
          const totalScore = (node.userScore || 0) + (node.aiScore || 0);
          const userRatio = totalScore > 0 ? (node.userScore || 0) / totalScore : 0.5;
          const aiRatio = totalScore > 0 ? (node.aiScore || 0) / totalScore : 0.5;

          // User Cyan Radiance
          const blueGrad = ctx.createRadialGradient(node.x - r * 0.4, node.y, 0, node.x, node.y, r * 1.9);
          blueGrad.addColorStop(0, 'rgba(56, 189, 248, 0.85)');
          blueGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.32)');
          blueGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
          ctx.fillStyle = blueGrad;
          ctx.beginPath();
          ctx.arc(node.x, node.y, r * 1.9, 0, Math.PI * 2);
          ctx.fill();

          // AI Amber Radiance
          const orangeGrad = ctx.createRadialGradient(node.x + r * 0.4, node.y, 0, node.x, node.y, r * 2.0);
          orangeGrad.addColorStop(0, 'rgba(251, 146, 60, 0.85)');
          orangeGrad.addColorStop(0.5, 'rgba(251, 146, 60, 0.38)');
          orangeGrad.addColorStop(1, 'rgba(251, 146, 60, 0)');
          ctx.fillStyle = orangeGrad;
          ctx.beginPath();
          ctx.arc(node.x, node.y, r * 2.0, 0, Math.PI * 2);
          ctx.fill();

          // Frosted Glass Body with Photon Mixing
          const bodyGrad = ctx.createLinearGradient(node.x - r, node.y, node.x + r, node.y);
          bodyGrad.addColorStop(0, 'rgba(125, 211, 252, 0.9)');
          bodyGrad.addColorStop(0.48, 'rgba(255, 255, 255, 0.95)');
          bodyGrad.addColorStop(1, 'rgba(253, 186, 116, 0.9)');

          ctx.beginPath();
          ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
          ctx.fillStyle = bodyGrad;
          ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;

          // Frosted Rim
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.lineWidth = 1;
          ctx.stroke();

          // Satellites
          if (node.satellites) {
            for (const s of node.satellites) {
              const sx = node.x + Math.cos(s.angle) * s.dist;
              const sy = node.y + Math.sin(s.angle) * s.dist;
              s.currentX = sx;
              s.currentY = sy;

              drawClippedLine(node.x, node.y, node.radius, sx, sy, s.radius, false, s.color === colors.partyAi ? 'rgba(251, 146, 60, 0.45)' : 'rgba(56, 189, 248, 0.45)', 0.95);

              if (s.isHollowRing) {
                ctx.beginPath();
                ctx.arc(sx, sy, s.radius, 0, Math.PI * 2);
                ctx.strokeStyle = s.color;
                ctx.lineWidth = 1.6;
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 6;
                ctx.stroke();
                ctx.shadowBlur = 0;
              } else {
                ctx.beginPath();
                ctx.arc(sx, sy, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.color;
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
              }
            }
          }

          // Wrapped Pedestal Text
          drawWrappedText(node.text, node.x, node.y + r + 11, 165, 15, 1.0, 11.5, false);
        }
      }

      ctx.restore();
    }

    // Interaction Listeners
    canvas.addEventListener('mousedown', (e) => {
      isPanning = true;
      dragStartX = e.clientX - panX;
      dragStartY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - dragStartX;
        panY = e.clientY - dragStartY;
        render();
        return;
      }

      // Check satellite hover
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left - (canvas.width / 2 + panX)) / zoom;
      const my = (e.clientY - rect.top - (canvas.height / 2 + panY)) / zoom;

      let found = null;
      for (const n of nodes) {
        if (n.satellites) {
          for (const s of n.satellites) {
            const dx = s.currentX - mx;
            const dy = s.currentY - my;
            if (Math.sqrt(dx * dx + dy * dy) <= s.radius + 8) {
              found = { satellite: s, node: n };
              break;
            }
          }
        }
        if (found) break;
      }

      if (found) {
        canvas.style.cursor = 'pointer';
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top = (e.clientY + 14) + 'px';
        tooltipHeader.textContent = found.satellite.isHollowRing ? 'AI Open Question' : 'User Requirement';
        tooltipHeader.style.color = found.satellite.color;
        tooltipBody.textContent = found.satellite.text;
      } else {
        canvas.style.cursor = isPanning ? 'grabbing' : 'grab';
        tooltip.style.display = 'none';
      }
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      zoom = Math.max(0.4, Math.min(2.5, zoom * zoomFactor));
      render();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentPair > 1) {
        switchPair(currentPair - 1);
      } else if (e.key === 'ArrowRight' && currentPair < capture.total_pairs) {
        switchPair(currentPair + 1);
      }
    });

    resize();
  </script>
</body>
</html>
